name: build-ios-dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Fetch Luau
        run: |
          git clone --depth 1 --branch 0.640 \
            https://github.com/luau-lang/luau.git luau

      - name: Build Luau for iOS
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cd luau
          make config=release \
            CXX="xcrun --sdk iphoneos clang++ -arch arm64 -isysroot $SDK -miphoneos-version-min=15.0" \
            CC="xcrun --sdk iphoneos clang -arch arm64 -isysroot $SDK -miphoneos-version-min=15.0" \
            build/release/libluauvm.a build/release/libluaucompiler.a || true
          cd ..
          echo "=================================================="
          echo "DIRECTORY LISTING"
          echo "=================================================="
          ls -la luau/build/release/ || echo "no release dir"
          echo "=================================================="
          echo "OBJECTS INSIDE libluauvm.a"
          echo "=================================================="
          ar t luau/build/release/libluauvm.a 2>&1 | head -80 || echo "cannot read archive"
          echo "=================================================="
          echo "SEARCH FOR luau_load SYMBOL"
          echo "=================================================="
          nm luau/build/release/libluauvm.a 2>&1 | grep -i "luau_load" | head -5 || echo "NOT FOUND"
          echo "=================================================="
          echo "SEARCH FOR lvmload OBJECT"
          echo "=================================================="
          ls -la luau/build/release/VM/src/ 2>&1 | grep -i "lvmload" || echo "no lvmload object"
          ls -la luau/build/release/VM/ 2>&1 || echo "no VM dir under release"
          echo "=================================================="

      - name: Build dylib
        run: |
          cd dylib
          make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: executor-dylib
          path: dylib/executor.dylib
