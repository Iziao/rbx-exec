name: build-ios-dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Fetch Luau
        run: |
          git clone --depth 1 --branch 0.640 \
            https://github.com/luau-lang/luau.git luau

      - name: Build Luau for iOS
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cd luau
          make config=release \
            CXX="xcrun --sdk iphoneos clang++ -arch arm64 -isysroot $SDK -miphoneos-version-min=15.0" \
            CC="xcrun --sdk iphoneos clang -arch arm64 -isysroot $SDK -miphoneos-version-min=15.0" \
            || true
          cd ..

      - name: Verify archive visibility from dylib dir
        run: |
          cd dylib
          echo "=== pwd: $(pwd) ==="
          echo "=== ../luau/build/release contents ==="
          ls -la ../luau/build/release/libluauvm.a ../luau/build/release/libluaucompiler.a

      - name: Build dylib
        run: |
          cd dylib
          make VERBOSE=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: executor-dylib
          path: dylib/executor.dylib
